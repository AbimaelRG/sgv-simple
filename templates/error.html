{% extends "base.html" if usuario else "base_simple.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<div class="mx-auto max-w-md py-16 text-center">
  <p class="text-5xl font-bold text-slate-300">{{ codigo }}</p>
  <h1 class="mt-4 text-xl font-semibold">{{ titulo }}</h1>
  <p class="mt-2 text-sm text-slate-600">{{ mensaje }}</p>
  <a class="btn btn-primario mt-6" href="{{ url_for('panel' if usuario else 'login') }}">{{ 'Volver al inicio' if usuario else 'Ir al inicio de sesión' }}</a>
</div>
{% endblock %}
